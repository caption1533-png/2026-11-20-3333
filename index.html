<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>행정정보 통합관리 기본법 조항 검색</title>
<style>
:root{--navy:#14365d;--pale:#eef4fb;--line:#dfe6ef;--text:#172433;--muted:#637286;--bg:#f5f7fa}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);line-height:1.65}
header{background:linear-gradient(125deg,#16365b,#285a92);color:white;padding:36px 20px 30px}.hero{max-width:1040px;margin:auto}.eyebrow{font-size:13px;letter-spacing:.08em;color:#c9ddf4;font-weight:700}.hero h1{font-size:clamp(25px,4vw,34px);margin:7px 0 10px;line-height:1.3}.hero p{margin:0;color:#dce9f7;font-size:15px}
main{max-width:1040px;margin:0 auto;padding:24px 20px 48px}.toolbar{background:white;border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 4px 18px #17243308;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.searchwrap{position:relative;flex:1;min-width:220px}.searchwrap svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:19px;height:19px;color:#718198}.search{width:100%;border:1px solid #d5deea;border-radius:10px;padding:12px 42px 12px;font-size:15px;outline:none;transition:.15s}.search:focus{border-color:#6d9bd0;box-shadow:0 0 0 3px #2865b015}.clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:#718198;font-size:20px;cursor:pointer;padding:5px 8px;display:none}.count{white-space:nowrap;background:var(--pale);color:var(--navy);border-radius:999px;padding:8px 13px;font-weight:750;font-size:14px}.count strong{font-size:16px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:18px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:19px 20px;box-shadow:0 2px 9px #17243305;transition:transform .15s,box-shadow .15s}.card:hover{transform:translateY(-2px);box-shadow:0 8px 22px #1724330a}.cardhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}.num{background:#eaf2fc;color:#235b99;border-radius:8px;padding:4px 9px;font-size:13px;font-weight:750;white-space:nowrap}.card h2{font-size:17px;margin:0;font-weight:750}.bodytext{white-space:pre-wrap;margin:0;font-size:14.5px;color:#354456;line-height:1.8}.empty{grid-column:1/-1;text-align:center;padding:48px 20px;background:white;border:1px dashed #cbd6e4;border-radius:14px;color:var(--muted)}.empty h3{color:var(--text);margin:0 0 6px;font-size:18px}.empty p{margin:0}footer{text-align:center;color:#8491a1;font-size:12px;padding:0 20px 28px}
@media(max-width:680px){header{padding:28px 18px 24px}main{padding:18px 14px 36px}.grid{grid-template-columns:1fr;gap:12px}.toolbar{padding:12px}.count{width:100%;text-align:center}.card{padding:17px}}
</style></head><body>
<header><div class="hero"><div class="eyebrow">조항 안내 · 검색 서비스</div><h1>행정정보 통합관리 기본법</h1><p>조항을 카드 형태로 열람하고, 본문 키워드로 필요한 내용을 빠르게 찾아보세요.</p></div></header>
<main><section class="toolbar" aria-label="조항 검색"><div class="searchwrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.8" cy="10.8" r="7.3"></circle><path d="m16.2 16.2 4.3 4.3"></path></svg><input id="search" class="search" type="search" placeholder="본문 키워드를 입력하세요" aria-label="본문 키워드 검색"><button class="clear" id="clear" aria-label="검색어 지우기">×</button></div><div class="count" id="count" aria-live="polite">결과 <strong>15</strong>건</div></section>
<section id="cards" class="grid" aria-live="polite"></section></main><footer>행정정보 통합관리 기본법 · 조항 검색</footer>
<script>
// 조항 데이터가 HTML 파일에 직접 포함되어 별도의 JSON 파일이 필요 없습니다.
const articles = [{"조": "제1조", "제목": "목적", "본문": "이 법은 행정정보의 통합관리와 공동활용에 관한 기본적인 사항을 정함으로써 행정의 효율성과 국민의 편익 증진에 이바지함을 목적으로 한다."}, {"조": "제2조", "제목": "정의", "본문": "이 법에서 사용하는 용어의 뜻은 다음 각 호와 같다.\n1. \"행정정보\"란 「전자정부법」 제2조제6호에 따른 행정정보를 말한다.\n2. \"공동활용\"이란 행정기관 간 행정정보를 상호 제공하여 사용하는 것을 말한다.\n3. \"통합관리\"란 「공공기록물 관리에 관한 법률」 제3조에 따른 기록물의 일부로 행정정보를 통합 관리하는 것을 말한다.\n4. \"데이터 표준\"이란 행정정보의 공동활용을 위한 형식·코드·식별자에 관한 표준을 말한다."}, {"조": "제3조", "제목": "다른 법률과의 관계", "본문": "행정정보의 통합관리 및 공동활용에 관하여 다른 법률에 특별한 규정이 있는 경우를 제외하고는 이 법에서 정하는 바에 따른다. 특히 「개인정보 보호법」, 「공공데이터의 제공 및 이용 활성화에 관한 법률」, 「지능정보화 기본법」에 따른 사항은 해당 법률을 우선 적용한다."}, {"조": "제4조", "제목": "국가 등의 책무", "본문": "국가와 지방자치단체는 행정정보의 통합관리와 공동활용을 위하여 필요한 시책을 수립하여야 한다. 행정안전부장관은 그 시책을 종합적으로 조정하며, 자세한 사항은 대통령령으로 정한다."}, {"조": "제5조", "제목": "기본계획의 수립", "본문": "① 행정안전부장관은 행정정보 통합관리 기본계획을 5년마다 수립하여야 한다.\n② 기본계획에는 다음 각 호의 사항을 포함하여야 한다.\n1. 행정정보 통합관리의 기본방향\n2. 행정정보 공동활용의 활성화 방안\n3. 「전자정부법」 제3조의 행정기관 정보화 시책과의 연계\n4. 그 밖에 대통령령으로 정하는 사항"}, {"조": "제6조", "제목": "시행계획의 수립", "본문": "행정기관의 장은 매년 시행계획을 수립하여야 하며, 그 결과를 행정안전부장관에게 보고하여야 한다. 시행계획의 형식과 절차는 대통령령으로 정한다."}, {"조": "제7조", "제목": "공동활용 협의회", "본문": "행정정보 공동활용에 관한 사항을 협의하기 위하여 행정안전부에 행정정보 공동활용 협의회를 둔다. 협의회의 구성과 운영에 필요한 사항은 대통령령으로 정한다."}, {"조": "제8조", "제목": "공동활용 신청", "본문": "행정기관의 장은 다른 행정기관이 보유한 행정정보를 활용하려는 경우에는 행정안전부장관에게 신청하여야 한다."}, {"조": "제9조", "제목": "공동활용 승인", "본문": "행정안전부장관은 신청을 받은 경우 「개인정보 보호법」 제17조에 따른 절차를 거쳐 30일 이내에 승인 여부를 결정하여야 한다."}, {"조": "제10조", "제목": "보안 조치", "본문": "공동활용 시 행정정보의 안전성 확보를 위하여 「정보통신망 이용촉진 및 정보보호 등에 관한 법률」 및 「개인정보 보호법」에서 정하는 보안 조치를 적용하여야 한다."}, {"조": "제11조", "제목": "데이터 표준", "본문": "행정안전부장관은 데이터 표준을 정하여 고시할 수 있다. 데이터 표준의 적용 범위와 시기는 대통령령으로 정한다."}, {"조": "제12조", "제목": "표준 적용 의무", "본문": "행정기관은 행정정보를 생산·관리·활용할 때 제11조에 따른 데이터 표준을 따라야 한다."}, {"조": "제13조", "제목": "실태조사", "본문": "행정안전부장관은 매년 행정정보 통합관리 실태를 조사하여 그 결과를 공개한다."}, {"조": "제14조", "제목": "과태료", "본문": "다음 각 호의 어느 하나에 해당하는 자에게는 1천만원 이하의 과태료를 부과한다.\n1. 제8조를 위반하여 승인 없이 공동활용한 자\n2. 제12조에 따른 데이터 표준을 정당한 사유 없이 위반한 자"}, {"조": "제15조", "제목": "시행일", "본문": "이 법은 2026년 7월 1일부터 시행한다."}];
const searchInput=document.getElementById('search'), cardsContainer=document.getElementById('cards'), countLabel=document.getElementById('count'), clearBtn=document.getElementById('clear');
function escapeHTML(value){return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function render(keyword=''){
 const query=keyword.trim().toLocaleLowerCase();
 const filtered=articles.filter(a=>!query||String(a['본문']||'').toLocaleLowerCase().includes(query));
 countLabel.innerHTML=`결과 <strong>${filtered.length}</strong>건`;
 clearBtn.style.display=keyword?'block':'none';
 if(!filtered.length){cardsContainer.innerHTML='<div class="empty"><h3>검색 결과가 없습니다.</h3><p>다른 키워드로 검색해 보세요.</p></div>';return;}
 cardsContainer.innerHTML=filtered.map(a=>`<article class="card"><div class="cardhead"><span class="num">${escapeHTML(a['조'])}</span><h2>${escapeHTML(a['제목'])}</h2></div><p class="bodytext">${escapeHTML(a['본문'])}</p></article>`).join('');
}
searchInput.addEventListener('input',()=>render(searchInput.value));
clearBtn.addEventListener('click',()=>{searchInput.value='';render();searchInput.focus();});
render();
</script></body></html>
